[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "exam-dataset-builder"
version = "0.1.0"
description = "Production document-to-exam-dataset pipeline"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "boto3>=1.35,<2",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "numpy>=2.1,<3",
  "opencv-python-headless>=4.10,<5",
  "pandas>=2.2,<3",
  "passlib[bcrypt]>=1.7,<2",
  "pillow>=11,<12",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "pyjwt>=2.10,<3",
  "pymupdf>=1.25,<2",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "pytesseract>=0.3.13,<1",
  "sqlalchemy>=2.0.36,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pytest-mock>=3.14,<4",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["packages/exam_builder"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL and RUN_INTEGRATION=1"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
