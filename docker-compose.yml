name: exam-dataset-builder

x-python-service: &python-service
  build:
    context: .
    dockerfile: docker/python.Dockerfile
    target: runtime
  env_file:
    - path: .env
      required: false
  restart: unless-stopped
  networks: [exam-network]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-exam_builder}
      POSTGRES_USER: ${POSTGRES_USER:-exam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exam}
    volumes: [postgres-data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-exam} -d ${POSTGRES_DB:-exam_builder}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [exam-network]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes: [redis-data:/data]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [exam-network]

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-exam-builder}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-this-secret}
    volumes: [minio-data:/data]
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [exam-network]

  migrate:
    <<: *python-service
    command: alembic upgrade head
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *python-service
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    <<: *python-service
    command: celery -A packages.exam_builder.celery_app:celery_app worker --loglevel=INFO --queues=documents,exports --concurrency=2
    stop_grace_period: 45s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  tests:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      target: test-runner
    env_file:
      - path: .env
        required: false
    environment:
      RUN_INTEGRATION: "1"
    command: pytest tests --cov=packages.exam_builder --cov=apps.api --cov-report=term-missing
    volumes:
      - ./tests:/app/tests:ro
    profiles: ["test"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    networks: [exam-network]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    networks: [exam-network]

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  exam-network:
    driver: bridge
